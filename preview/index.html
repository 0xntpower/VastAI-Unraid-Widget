<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Vast.ai tile preview</title>
  <!--
    Shows the real tile without an Unraid server. Nothing here is a copy of the
    plugin: the tile markup is tests/fixtures/shell.html (written by
    shell.test.php from the real VastAI.php), the data is
    tests/fixtures/payload.json (written by endpoint.test.php from the real
    endpoint), and the script and stylesheet are loaded from src/.

    Serve the repository root and open this page:
      python3 -m http.server 8099 --bind 127.0.0.1
      http://127.0.0.1:8099/preview/

    The colours below are Unraid 7.4.1's values for its white and black themes.
  -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/4.7.0/css/font-awesome.min.css"
        integrity="sha384-wvfXpqpZZVQGK6TAh5PVlGOfQNHSoD2xbE+QkPxCAFlNEevoEH3Sl0sibVcOQVnN" crossorigin="anonymous">
  <script src="https://code.jquery.com/jquery-3.6.4.min.js"
          integrity="sha384-UG8ao2jwOWB7/oDdObZc6ItJmwUkR/PfMyt9Qs5AwX7PsnYn1CRKCTWyncPTWvaS" crossorigin="anonymous"></script>
  <style>
    html { font-size: 62.5%; }
    html[data-theme="white"] {
      --text-color: #000; --alt-text-color: #9794a0; --border-color: #d3d3d3;
      --mild-background-color: #f7f9f9; --link-text-color: #486dba; --page: #f2f2f2;
    }
    html[data-theme="black"] {
      --text-color: #f2f2f2; --alt-text-color: #808080; --border-color: #404040;
      --mild-background-color: #262626; --link-text-color: #486dba; --page: #000;
    }
    body { margin: 0; padding: 2rem; background: var(--page); color: var(--text-color); font: 1.3rem/1.5 clear-sans, sans-serif; }
    .bar { display: flex; gap: 1.5rem; margin-bottom: 2rem; }
    table.dashboard { width: 70rem; max-width: 100%; border-collapse: collapse; background: var(--mild-background-color); }
    table.dashboard td { padding: 1rem 1.5rem; }
    /* Copied from Unraid 7.4.1: styles/default-base.css and sheets/DashStats.css */
    .green-text { color: #4f8a10; } .red-text { color: #f0000c; } .orange-text { color: #e68a00; }
    .blue-text { color: #486dba; } .grey-text { color: var(--alt-text-color); }
    .tile-header { display: flex; justify-content: space-between; align-items: start; gap: 1rem; }
    .tile-header-left, .tile-header-right { display: flex; flex-wrap: wrap; align-items: start; gap: 1rem; }
    .tile-header-right-controls { display: inline-flex; align-items: center; gap: .5rem; }
  </style>
</head>
<body>
  <div class="bar">
    <label>Theme <select id="theme"><option>white</option><option>black</option></select></label>
    <label>Answer from the endpoint <select id="scenario">
      <option value="live">live</option>
      <option value="cached">cached</option>
      <option value="stale">stale</option>
      <option value="empty">no machines</option>
      <option value="auth">rejected key</option>
      <option value="upstream">Vast.ai down, nothing cached</option>
      <option value="not_configured">not configured</option>
      <option value="signed_out">session ended</option>
    </select></label>
  </div>
  <table class="dashboard" id="tile"></table>

  <script>
    const BASE = '../src/vastai/usr/local/emhttp/plugins/vastai/';
    const params = new URLSearchParams(location.search);
    const theme = params.get('theme') || 'white';
    const scenario = params.get('scenario') || 'live';
    document.documentElement.dataset.theme = theme;
    $('#theme').val(theme);
    $('#scenario').val(scenario);
    // A reload per change, so the tile script always starts clean.
    $('#theme, #scenario').on('change', () => {
      location.search = new URLSearchParams({ theme: $('#theme').val(), scenario: $('#scenario').val() });
    });

    const fail = (code, error) => ({ success: false, code, error, timestamp: 0 });
    const answers = (payload) => ({
      live: payload,
      cached: { ...payload, cached: true, cache_age: 12 },
      stale: { ...payload, stale: true, cache_age: 1500, warning: 'Vast.ai API error (HTTP 502). Showing cached data.' },
      empty: { ...payload, machines: [], summary: { ...payload.summary, total_machines: 0, online_machines: 0, rented_machines: 0, total_earn_hour: 0 } },
      auth: fail('auth', 'Invalid user key (HTTP 404)'),
      upstream: fail('upstream', 'Operation timed out after 9001 milliseconds'),
      not_configured: fail('not_configured', 'Vast.ai API Key is not configured. Please open Settings → Utilities → Vast.ai Monitor to enter your API key.'),
    });

    Promise.all([
      fetch('../tests/fixtures/shell.html').then((r) => r.text()),
      fetch('../tests/fixtures/payload.json').then((r) => r.json()),
    ]).then(([shell, payload]) => {
      // The only request the tile makes is answered here.
      $.ajax = (opts) => setTimeout(() => (scenario === 'signed_out'
        ? opts.error({}, 'parsererror', '')
        : opts.success(answers(payload)[scenario])), 300);
      // The shell links its files under /plugins/vastai/. Here they live in src/.
      // A script inserted as text does not run, so it is added again below.
      document.getElementById('tile').innerHTML = shell.replaceAll('/plugins/vastai/', BASE);
      document.body.appendChild(Object.assign(document.createElement('script'), { src: BASE + 'javascript/vastai.js' }));
    });
  </script>
</body>
</html>
